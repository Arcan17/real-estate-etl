version: "3.9"

services:
  # Run the full ETL pipeline (scrape → transform → load → analytics)
  pipeline:
    build: .
    volumes:
      - ./data:/app/data
    command: python src/main.py
    profiles: ["pipeline"]

  # Launch the Streamlit dashboard (requires data/listings.duckdb)
  dashboard:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    command: >
      streamlit run dashboard.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true

  # Launch the FastAPI REST API (requires data/listings.duckdb)
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    profiles: ["api"]
